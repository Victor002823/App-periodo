name: Compilar APK Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Crear directorio de assets
        run: mkdir -p android/app/src/main/assets

      - name: Generar Bundle de React Native
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/ || true

      - name: Dar permisos a Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK de Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK a Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: drip-espanol-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
